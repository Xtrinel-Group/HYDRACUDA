# HYDRACUDA policy — version 2.
#
# Direct migration of examples/policy-v1-legacy.yaml. Rules are evaluated in
# order and the first match wins, so the narrow deny rules sit above the broad
# allow rule. See docs/policy-spec.md for the full specification.

version: 2
mode: enforce

# Applied when no rule below matches. Defaults to deny so that adding a tool
# without adding a rule fails closed.
default_action: deny

audit_path: .hydracuda/audit.db

# What exists. Kept separate from what is permitted, and used by
# `hydracuda plan` to walk the full declared surface.
adapters:
  - name: local
    type: local_tools
    resources:
      - read_file
      - delete_record
      - execute_shell
    config:
      # Confines every declared path parameter. This is what actually stops
      # traversal: a path resolving outside the root is refused regardless of
      # how it was spelled, encoded, or symlinked. The deny rule below is
      # defence in depth on top of it, not the control itself.
      root: ./workspace

rules:
  - name: block-sensitive-paths
    resource: read_file
    action: deny
    reason: "read_file: path is outside the permitted surface"
    where:
      path:
        matches:
          - "/etc/"
          - "\\.\\."
          - "/root/"

  - name: allow-file-reads
    resource: read_file
    action: allow

  - name: block-destructive-deletes
    resource: delete_record
    action: deny
    reason: "Destructive operation. Blocked by default."

  - name: shell-requires-approval
    resource: execute_shell
    action: review

# What the rules above are supposed to decide, as cases `hydracuda test` checks.
# Strict validation catches a misspelled key; it cannot catch a correctly spelled
# rule in the wrong order, and order is what decides here. `expect_rule` is the
# part that notices: moving `allow-file-reads` above `block-sensitive-paths`
# leaves both `expect: deny` lines below unsatisfied instead of silently passing.
tests:
  - name: an-ordinary-read-is-allowed
    resource: read_file
    params: {path: notes.txt}
    expect: allow
    expect_rule: allow-file-reads

  - name: traversal-is-denied
    resource: read_file
    params: {path: ../secrets/key.pem}
    expect: deny
    expect_rule: block-sensitive-paths

  - name: system-paths-are-denied
    resource: read_file
    params: {path: /etc/passwd}
    expect: deny
    expect_rule: block-sensitive-paths

  - name: deletes-are-denied
    resource: delete_record
    expect: deny
    expect_rule: block-destructive-deletes

  - name: the-shell-is-held-for-review
    resource: execute_shell
    expect: review
    expect_rule: shell-requires-approval

  # Not in the `adapters` block, so the boundary refuses it before any rule is
  # consulted. `default_action: deny` would have denied it too — this asserts the
  # stronger thing, that a resource nobody declared cannot be reached at all.
  - name: an-undeclared-tool-is-refused
    resource: write_file
    expect: refused
