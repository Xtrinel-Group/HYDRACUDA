name: Publish HYDRACUDA to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build

      - run: python -m build

      # v1.12.3 bundled Twine 6, which rejects core metadata 2.5 with
      # "InvalidDistribution: Make sure the distribution is using a
      # supported Metadata-Version". Hatchling is unpinned in
      # pyproject.toml's build requirements, so it started emitting 2.5 on
      # its own and the v0.3.0 publish failed at the metadata check. This
      # version bundles Twine 7, which accepts 2.5.
      - uses: pypa/gh-action-pypi-publish@v1.14.2
