[build-system]
# Pinned to a verified band, with an upper bound, because this was unpinned and
# drifted: hatchling 1.32.0 raised its default core metadata version from 2.4 to
# 2.5, and the v0.3.0 publish failed at Twine's metadata check without a single
# line of this repository having changed. Probed per release —
# 1.27/1.29/1.31 emit 2.4, 1.32 emits 2.5 — and the publish action's Twine 7
# accepts both, so the whole band below is known good.
#
# The upper bound is the point. A release pipeline that only runs at release
# time cannot also be the place a floating build dependency is discovered.
# Raise this deliberately, after checking what the new default emits and what
# the pinned pypa/gh-action-pypi-publish accepts.
requires = ["hatchling>=1.27,<1.33"]
build-backend = "hatchling.build"

[project]
name = "hydracuda"
version = "0.4.0"
description = "Hybrid Runtime Access Control for Untrusted Delegated Actions. Runtime policy enforcement proxy for AI tool calls."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["ai", "security", "mcp", "llm", "guardrails", "policy"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "pyyaml>=6.0",
    "aiosqlite>=0.19",
]

[project.urls]
Homepage = "https://github.com/Xtrinel-Group/HYDRACUDA"
Issues = "https://github.com/Xtrinel-Group/HYDRACUDA/issues"

[project.scripts]
hydracuda = "hydracuda.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
]
# The dashboard is not distributed — see the sdist configuration below. This
# extra is for working from a git checkout: pip install -e ".[dashboard]".
dashboard = [
    "flask>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hydracuda"]
# `scripts/build_extension.py` writes the compiled engine into `src/hydracuda/`,
# because that is where the editable install looks for it. Hatchling would then
# sweep it into this wheel — a platform-specific binary inside an artifact tagged
# `py3-none-any`, which would install on machines it cannot load on. Excluded
# until the release pipeline builds the per-platform wheels properly.
exclude = ["*.so", "*.pyd", "*.dylib"]

# Curated deliberately. Hatchling's default sdist is "every file git does not
# ignore", which is how the dashboard reached PyPI: it was never in the wheel,
# so nobody noticed the sdist carried it, and a cross-site scripting bug in it
# shipped in the v0.2.0 source distribution. That default also shipped CI
# configuration and the retired `deprecation/baracuda` package.
#
# The dashboard is intentionally absent from both artifacts. It is an optional
# development tool, run from a checkout, and `dashboard` is far too generic a
# name to install into site-packages. Anything added here is something users
# receive, so add deliberately.
#
# Patterns are gitignore-style, so they are anchored with a leading slash.
# Unanchored "README.md" also matched deprecation/README.md.
[tool.hatch.build.targets.sdist]
include = [
    "/src/hydracuda",
    "/tests",
    "/examples",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]
# `.gitignore` is still added: hatchling force-includes it and an `exclude`
# entry does not override that. Left as-is rather than left as a config line
# that asserts a control it does not have. It lists only filenames, nothing
# sensitive.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
